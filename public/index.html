<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flappy NEAT</title>
    <meta name="description" content="Play Flappy Bird, or watch neural networks learn it with NEAT." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a0a'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23c8ff2e'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="name" href="/">Flappy NEAT</a>
      <nav class="tabs" aria-label="Mode">
        <button type="button" data-mode="play" aria-pressed="true">Play</button>
        <button type="button" data-mode="evolve" aria-pressed="false">Evolve</button>
      </nav>
      <a class="link" href="/method.html">How it works</a>
    </header>

    <main class="main">
      <div class="stage-wrap">
        <div class="stage">
          <canvas id="game" aria-label="Game. Press space or tap to flap."></canvas>
        </div>
      </div>

      <aside class="panel">
        <div class="pane" data-pane="play">
          <dl class="stats">
            <div><dt>Score</dt><dd id="play-score">0</dd></div>
            <div><dt>Best</dt><dd id="play-best">0</dd></div>
          </dl>
          <label class="check">
            <input type="checkbox" id="ghost-toggle" />
            <span>Race the best evolved bird</span>
          </label>
          <p class="note" id="ghost-note"></p>
        </div>

        <div class="pane" data-pane="evolve" hidden>
          <dl class="stats">
            <div><dt>Generation</dt><dd id="evo-gen">0</dd></div>
            <div><dt>Alive</dt><dd id="evo-alive">0</dd></div>
            <div><dt>Score</dt><dd id="evo-score">0</dd></div>
            <div><dt>Record</dt><dd id="evo-record">0</dd></div>
          </dl>

          <section>
            <h2>Leading bird</h2>
            <canvas id="network" class="network" aria-label="The leading bird's neural network"></canvas>
          </section>

          <section>
            <h2>Best score by generation</h2>
            <canvas id="history" class="history" aria-label="Best score per generation"></canvas>
          </section>

          <section class="controls">
            <div class="row">
              <button type="button" class="text" id="pause">Pause</button>
              <button type="button" class="text" id="reset">Restart</button>
            </div>
            <div class="row">
              <span>Speed</span>
              <div class="options" data-setting="speed">
                <button type="button" data-value="1">1×</button>
                <button type="button" data-value="4">4×</button>
                <button type="button" data-value="16">16×</button>
                <button type="button" data-value="max">Max</button>
              </div>
            </div>

            <details>
              <summary>Settings</summary>
              <div class="row">
                <span>Birds</span>
                <div class="options" data-setting="populationSize">
                  <button type="button" data-value="25">25</button>
                  <button type="button" data-value="50">50</button>
                  <button type="button" data-value="100">100</button>
                  <button type="button" data-value="200">200</button>
                </div>
              </div>
              <div class="row">
                <span>Mutation</span>
                <div class="options" data-setting="mutation">
                  <button type="button" data-value="low">Low</button>
                  <button type="button" data-value="mid">Medium</button>
                  <button type="button" data-value="high">High</button>
                </div>
              </div>
              <div class="row">
                <span>Species</span>
                <div class="options" data-setting="species">
                  <button type="button" data-value="few">Few</button>
                  <button type="button" data-value="mid">Some</button>
                  <button type="button" data-value="many">Many</button>
                </div>
              </div>
              <div class="row">
                <span>Course</span>
                <div class="options" data-setting="course">
                  <button type="button" data-value="varied">New each time</button>
                  <button type="button" data-value="fixed">Same</button>
                </div>
              </div>
              <p class="note">Changing the number of birds restarts the run.</p>
            </details>
          </section>
        </div>
      </aside>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
